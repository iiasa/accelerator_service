  hosts.toml: |
    server = "https://registry:8443"

    [host."https://host.docker.internal:8443"]
      capabilities = ["pull", "resolve"]
      ca = ["/etc/containerd/certs.d/registry:8443/ca.crt"]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: containerd-registry-trust
  namespace: kube-system
  labels:
    app: containerd-registry-trust
spec:
  selector:
    matchLabels:
      app: containerd-registry-trust
  template:
    metadata:
      labels:
        app: containerd-registry-trust
    spec:
      hostNetwork: true
      tolerations:
        - operator: Exists
      containers:
        - name: configurator
          image: alpine:latest
          securityContext:
            privileged: true
          command: [ "/bin/sh", "-c" ]
          args:
            - |
              mkdir -p /host/etc/containerd/certs.d/registry:8443
              cp -f /config/ca.crt /host/etc/containerd/certs.d/registry:8443/ca.crt
              cp -f /config/hosts.toml /host/etc/containerd/certs.d/registry:8443/hosts.toml
              echo "Registry certificates and hosts.toml installed successfully"
              sleep infinity
          volumeMounts:
            - name: host-etc
              mountPath: /host/etc
            - name: config-vol
              mountPath: /config
      volumes:
        - name: host-etc
          hostPath:
            path: /etc
        - name: config-vol
          configMap:
            name: registry-certs-config