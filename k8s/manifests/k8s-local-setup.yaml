# ==========================================
# 1. MINIO BRIDGE (ExternalName to host gateway)
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: default
spec:
  type: ExternalName
  externalName: host.docker.internal
---
# ==========================================
# 2. REGISTRY BRIDGE (ExternalName to host gateway)
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: default
spec:
  type: ExternalName
  externalName: host.docker.internal
---
# ==========================================
# 3. BACKEND BRIDGE (ExternalName to host gateway)
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: web-be
  namespace: default
spec:
  type: ExternalName
  externalName: host.docker.internal
---
# ==========================================
# 4. STORAGE CLASSES
# ==========================================
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: nfs-rwx
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
---
